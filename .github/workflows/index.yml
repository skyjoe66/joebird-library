name: index

# A contribution adds birds/<key>.png (and maybe birds/<key>.json). This
# rebuilds manifest.json and index.json from the folder and commits them, so
# pull requests never touch the two files they would otherwise all conflict on.
on:
  push:
    branches: [main]
    paths: ["birds/**", "tools/build_index.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_index.py
      - name: commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json index.json
          git diff --cached --quiet && echo "index unchanged" && exit 0
          git commit -m "index: rebuild after $(git log -1 --format=%h)"
          git push
